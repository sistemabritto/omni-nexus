## ============================================================================
## OmniRoute — stack Docker Swarm / Portainer (versão genérica, compartilhável)
##
## Gateway de IA self-hosted (github.com/diegosouzapw/OmniRoute, MIT). Esta
## stack roda o OmniRoute isolado, com Redis próprio, atrás do Traefik.
##
## Pré-requisitos no seu Swarm:
##   * Traefik já anexado a uma rede externa (aqui chamada network_public)
##   * Entrypoint TLS (aqui "websecure") e cert resolver (aqui
##     "letsencryptresolver") configurados no Traefik
##   * Um domínio seu apontando (registro DNS A) para o IP do seu Swarm
##
## Como usar:
##   1. Troque OMNIROUTE_HOSTNAME abaixo, ou defina como variável de ambiente
##      da stack no Portainer (Environment variables), pelo seu domínio real.
##   2. No PRIMEIRO deploy (banco vazio), gere os segredos e adicione as
##      quatro linhas abaixo em `environment:` do serviço omniroute:
##        INITIAL_PASSWORD=<senha de login do dashboard>
##        JWT_SECRET=<openssl rand -base64 48>
##        API_KEY_SECRET=<openssl rand -hex 32>
##        STORAGE_ENCRYPTION_KEY=<openssl rand -hex 32>
##      Defina os valores como env var da stack no Portainer — NUNCA escreva
##      o valor real neste arquivo.
##   3. Depois do primeiro boot bem-sucedido, o OmniRoute persiste esses
##      quatro sozinho em /app/data/server.env, dentro do volume
##      omniroute_data. REMOVA as quatro linhas do compose (não deixe
##      declaradas vazias!) antes do próximo deploy — confirmado ao vivo em
##      11/09/2026: uma env var DECLARADA e VAZIA (`STORAGE_ENCRYPTION_KEY=`
##      sem valor) não é o mesmo que ela não existir. O OmniRoute usou a
##      string vazia como chave de descriptografia real e toda credencial
##      salva parou de funcionar. Redeploy sem a linha nenhuma (nem vazia)
##      resolve — o app volta a ler o valor persistido no arquivo.
##   4. Se for migrar um OmniRoute já existente (outro host, outra stack) em
##      vez de começar do zero, NÃO deixe o volume `omniroute_data` como
##      está abaixo — troque para `external: true` apontando pro nome do
##      volume antigo, senão o Swarm cria um vazio e você perde os segredos
##      e todas as API keys já emitidas.
##
## Serviço interno: outros containers na mesma rede acessam via
## http://omniroute:20128/v1 (alias Docker), sem passar pelo domínio público.
## ============================================================================
version: "3.8"

services:

  redis:
    image: redis:alpine
    networks:
      network_public:
        aliases:
          - omniroute-redis
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 256M

  omniroute:
    image: ${OMNIROUTE_IMAGE:-diegosouzapw/omniroute:latest}
    depends_on:
      - redis

    volumes:
      - omniroute_data:/app/data

    networks:
      network_public:
        aliases:
          - omniroute

    environment:
      - TZ=${TZ:-America/Sao_Paulo}
      - PORT=20128
      - REQUIRE_API_KEY=true
      - INITIAL_PASSWORD=${OMNIROUTE_INITIAL_PASSWORD}
      - JWT_SECRET=${OMNIROUTE_JWT_SECRET}
      - API_KEY_SECRET=${OMNIROUTE_API_KEY_SECRET}
      - STORAGE_ENCRYPTION_KEY=${OMNIROUTE_STORAGE_KEY}
      - AUTH_COOKIE_SECURE=true
      - OMNIROUTE_TRUST_PROXY=true
      - NEXT_PUBLIC_BASE_URL=https://${OMNIROUTE_HOSTNAME}
      - OMNIROUTE_PUBLIC_BASE_URL=https://${OMNIROUTE_HOSTNAME}
      - CORS_ALLOWED_ORIGINS=https://${OMNIROUTE_HOSTNAME}
      - REDIS_URL=redis://redis:6379

    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.mjs"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5

    deploy:
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 0
      update_config:
        failure_action: rollback
        monitor: 90s
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "${OMNIROUTE_CPUS:-2}"
          memory: "${OMNIROUTE_MEMORY:-2048M}"
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - traefik.http.routers.omniroute.rule=Host(`${OMNIROUTE_HOSTNAME}`)
        - traefik.http.routers.omniroute.entrypoints=websecure
        - traefik.http.routers.omniroute.tls.certresolver=letsencryptresolver
        - traefik.http.routers.omniroute.service=omniroute
        - traefik.http.services.omniroute.loadbalancer.server.port=20128
        - traefik.http.services.omniroute.loadbalancer.passHostHeader=true

volumes:
  omniroute_data:

networks:
  network_public:
    external: true
    name: network_public
