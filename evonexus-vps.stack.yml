## ============================================================================
## EvoNexus — VPS / Docker Swarm stack (pessoal — Sistema Britto)
##
## Target VPS:
##   * Traefik already attached to external network_public
##   * TLS entrypoint: websecure
##   * Cert resolver: letsencryptresolver
##   * Public hosts: nexus.workflowapi.com.br (EvoNexus)
##                   omni.workflowapi.com.br  (OmniRoute)
##
## OpenReply (openreply.workflowapi.com.br) mora em stack PRÓPRIA desde
## 25/08/2026 — ver openreply-vps.stack.yml. Não voltar a colar aqui: foi
## exatamente misturar um serviço sem nada a ver com o dashboard neste mesmo
## compose que causou a divergência de três vias (repo/Portainer/VPS ao vivo)
## descoberta naquele dia. Ver ticket 3497e698 no Nexus.
##
## OmniRoute: os segredos reais (JWT_SECRET, API_KEY_SECRET,
## STORAGE_ENCRYPTION_KEY) NÃO vêm daqui nem do Portainer — o próprio app os
## gera no primeiro boot e persiste em /app/data/server.env, dentro do volume
## omniroute_data. Definir essas três como env da stack SOBRESCREVE o arquivo
## e invalida toda API key já emitida (aconteceu em 25/08/2026, derrubou o
## Hermes local do Felipe). Deixar de fora de propósito — omitir é o correto.
##
## Segredos ficam FORA do repo: os valores reais (DASHBOARD_API_TOKEN,
## OMNIROUTE_INITIAL_PASSWORD, SMTP_*, etc) são preenchidos como variáveis de
## ambiente da stack no Portainer. Os placeholders abaixo marcam onde entram.
##   DASHBOARD_API_TOKEN        → openssl rand -base64 32
##   APPROVAL_BRIDGE_TOKEN      → openssl rand -base64 32 (SÓ em
##     evonexus_dashboard + evonexus_telegram — NUNCA em evonexus_scheduler,
##     que spawna os subprocessos dos agentes; ver goal-ticket-unification
##     ADR SPEC 3f / Vault V1c-V2-V10)
##   OMNIROUTE_INITIAL_PASSWORD → só vale no bootstrap de banco vazio (ver
##     nota acima) — não redefinir num omniroute já inicializado.
## ============================================================================
version: "3.7"

services:

  ## Fica sozinho aqui porque o OmniRoute (abaixo) usa redis://redis:6379 pra
  ## cache/fila própria. Não é do OpenReply — o OpenReply tem o seu dedicado
  ## na stack separada (ver openreply-vps.stack.yml).
  redis:
    image: redis:alpine
    networks:
      - network_public
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 256M

  evonexus_dashboard:
    image: excarplex/evo-nexus-dashboard:latest

    volumes:
      - evonexus_config:/workspace/config
      - evonexus_workspace:/workspace/workspace
      - evonexus_dashboard_data:/workspace/dashboard/data
      - evonexus_memory:/workspace/memory
      - evonexus_backups:/workspace/backups
      - evonexus_adw_logs:/workspace/ADWs/logs
      - evonexus_claude_workspace:/workspace/.claude
      - evonexus_agent_memory:/workspace/.claude/agent-memory
      - evonexus_claude_auth:/root/.claude
      - evonexus_codex_auth:/root/.codex
      - evonexus_openclaude_auth:/root/.openclaude

    networks:
      network_public:
        aliases:
          - evonexus-dashboard

    environment:
      - DASHBOARD_API_TOKEN=${DASHBOARD_API_TOKEN}
      - DASHBOARD_API_USER=${DASHBOARD_API_USER:-admin}
      ## Validates the Telegram bot's approval-decision calls
      ## (/api/approvals/*/decision) — dedicated credential, deliberately
      ## separate from DASHBOARD_API_TOKEN (goal-ticket-unification Vault V1).
      - APPROVAL_BRIDGE_TOKEN=${APPROVAL_BRIDGE_TOKEN}
      - APPROVAL_DECISION_TIMEOUT_SECONDS=${APPROVAL_DECISION_TIMEOUT_SECONDS:-105}
      ## Telegram user ids allowed to press an approve/reject button — comma
      ## or semicolon-separated (Vault V3, per-individual not per-chat).
      - APPROVAL_APPROVER_IDS=${APPROVAL_APPROVER_IDS}
      ## Postiz is called only by the dashboard after human approval.
      - POSTIZ_URL=${POSTIZ_URL}
      - POSTIZ_API_KEY=${POSTIZ_API_KEY}
      - POSTIZ_INTEGRATION_INSTAGRAM_ID=${POSTIZ_INTEGRATION_INSTAGRAM_ID}
      - POSTIZ_INTEGRATION_LINKEDIN_ID=${POSTIZ_INTEGRATION_LINKEDIN_ID}
      - POSTIZ_ALLOWED_MEDIA_HOSTS=${POSTIZ_ALLOWED_MEDIA_HOSTS}
      - POSTIZ_PUBLISH_TIMEOUT_SECONDS=${POSTIZ_PUBLISH_TIMEOUT_SECONDS:-90}
      - POSTIZ_PUBLISH_POLL_SECONDS=${POSTIZ_PUBLISH_POLL_SECONDS:-3}
      ## MinIO/S3 media host (int-minio, Option A). Available to agent
      ## subprocesses so they can upload generated media; unlike POSTIZ_API_KEY
      ## it is NOT a publish credential (the Instagram post still needs
      ## approval), so it is intentionally not denylisted from agents.
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET:-post}
      - MINIO_PUBLIC_BASE=${MINIO_PUBLIC_BASE}
      - EVONEXUS_API_URL=http://localhost:8080
      - CORS_ALLOWED_ORIGINS=https://nexus.workflowapi.com.br
      - TZ=America/Sao_Paulo
      - EVONEXUS_PORT=8080
      - TERMINAL_SERVER_PORT=32352
      - FORWARDED_ALLOW_IPS=*
      ## Guard-rails do terminal: teto de PTYs claude simultâneos (cada um
      ## consome 200-400MB) e TTL pra recolher sessões sem aba aberta.
      - TERMINAL_MAX_ACTIVE_SESSIONS=${TERMINAL_MAX_ACTIVE_SESSIONS:-4}
      - TERMINAL_DETACHED_TTL_MINUTES=${TERMINAL_DETACHED_TTL_MINUTES:-30}
      - SMTP_DOMAIN=${SMTP_DOMAIN}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_ADDRESS=${SMTP_ADDRESS}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_AUTHENTICATION=${SMTP_AUTHENTICATION}
      - SMTP_ENABLE_STARTTLS_AUTO=${SMTP_ENABLE_STARTTLS_AUTO}
      ## Transcrição (Groq whisper-large-v3-turbo) — feedback em áudio na
      ## tela /pautas (feedback_audio.py). Mesma chave que o media-worker usa
      ## na Fase 1B da esteira de vídeo (transcricao.py), serviço separado.
      - GROQ_API_KEY=${GROQ_API_KEY}
      ## Provider API Keys (needed for fallback chain)
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}

    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          ## O dashboard hospeda Flask + terminal-server + os processos
          ## claude/openclaude das abas — 1GB derrubava com 2-3 agentes.
          cpus: "${EVONEXUS_DASHBOARD_CPUS:-2}"
          memory: ${EVONEXUS_DASHBOARD_MEMORY:-2048M}
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public

        ## Flask API + React SPA on :8080
        - traefik.http.routers.evonexus_dashboard.rule=Host(`nexus.workflowapi.com.br`)
        - traefik.http.routers.evonexus_dashboard.entrypoints=websecure
        - traefik.http.routers.evonexus_dashboard.priority=1
        - traefik.http.routers.evonexus_dashboard.tls.certresolver=letsencryptresolver
        - traefik.http.routers.evonexus_dashboard.service=evonexus_dashboard
        - traefik.http.services.evonexus_dashboard.loadbalancer.server.port=8080
        - traefik.http.services.evonexus_dashboard.loadbalancer.passHostHeader=true

        ## Embedded terminal-server on :32352. /terminal is stripped before proxying.
        ## Both routers need an explicit .service= label: two services share this
        ## container's label set, and without it Traefik can't auto-link either
        ## router — it errors "cannot be linked automatically with multiple
        ## Services" and drops BOTH routers silently (confirmed 2026-08-24: took
        ## nexus.workflowapi.com.br entirely offline, 404 on every path including
        ## the video shares behind /aula-vps-crm-do-zero).
        - traefik.http.routers.evonexus_terminal.rule=Host(`nexus.workflowapi.com.br`) && PathPrefix(`/terminal`)
        - traefik.http.routers.evonexus_terminal.entrypoints=websecure
        - traefik.http.routers.evonexus_terminal.priority=10
        - traefik.http.routers.evonexus_terminal.tls.certresolver=letsencryptresolver
        - traefik.http.routers.evonexus_terminal.service=evonexus_terminal
        - traefik.http.routers.evonexus_terminal.middlewares=evonexus_terminal_strip
        - traefik.http.services.evonexus_terminal.loadbalancer.server.port=32352
        - traefik.http.services.evonexus_terminal.loadbalancer.passHostHeader=true
        - traefik.http.middlewares.evonexus_terminal_strip.stripprefix.prefixes=/terminal

  evonexus_telegram:
    image: excarplex/evo-nexus-runtime:latest
    # TELEGRAM_MODE=provider → telegram_provider_bot.py no provider ativo do
    # dashboard (NVIDIA, OmniRoute, OpenRouter, Codex...). O modo channels
    # exige login claude.ai e não funciona via providers OpenAI-compatíveis.
    command: ["bash", "scripts/telegram_swarm_entry.sh"]

    volumes:
      - evonexus_config:/workspace/config
      - evonexus_workspace:/workspace/workspace
      - evonexus_memory:/workspace/memory
      - evonexus_adw_logs:/workspace/ADWs/logs
      - evonexus_claude_workspace:/workspace/.claude
      - evonexus_agent_memory:/workspace/.claude/agent-memory
      - evonexus_claude_auth:/root/.claude
      - evonexus_codex_auth:/root/.codex
      - evonexus_openclaude_auth:/root/.openclaude

    networks:
      network_public:
        aliases:
          - evonexus_telegram

    environment:
      - DASHBOARD_API_TOKEN=${DASHBOARD_API_TOKEN}
      - DASHBOARD_API_USER=${DASHBOARD_API_USER:-admin}
      ## Sends approval-decision calls to the dashboard's bridge-only route —
      ## see the matching var on evonexus_dashboard above.
      - APPROVAL_BRIDGE_TOKEN=${APPROVAL_BRIDGE_TOKEN}
      - APPROVAL_DECISION_TIMEOUT_SECONDS=${APPROVAL_DECISION_TIMEOUT_SECONDS:-105}
      ## MinIO/S3 for agents spawned via chat (a publishing agent messaged here
      ## uploads media the same way heartbeat-spawned ones do). See dashboard.
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET:-post}
      - MINIO_PUBLIC_BASE=${MINIO_PUBLIC_BASE}
      - EVONEXUS_API_URL=http://evonexus-dashboard:8080
      - TELEGRAM_MODE=provider
      - TELEGRAM_TIMEOUT=900
      - TELEGRAM_MAX_TURNS=30
      - GROQ_API_KEY=${GROQ_API_KEY}
      ## Provider API Keys (needed for fallback chain)
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TZ=America/Sao_Paulo
      - SMTP_DOMAIN=${SMTP_DOMAIN}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_ADDRESS=${SMTP_ADDRESS}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_AUTHENTICATION=${SMTP_AUTHENTICATION}
      - SMTP_ENABLE_STARTTLS_AUTO=${SMTP_ENABLE_STARTTLS_AUTO}

    stdin_open: true
    tty: true

    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: "1536M"

  evonexus_scheduler:
    image: excarplex/evo-nexus-runtime:latest
    command: ["uv", "run", "python", "scheduler.py"]

    volumes:
      - evonexus_config:/workspace/config
      - evonexus_workspace:/workspace/workspace
      - evonexus_dashboard_data:/workspace/dashboard/data
      - evonexus_memory:/workspace/memory
      - evonexus_adw_logs:/workspace/ADWs/logs
      - evonexus_claude_workspace:/workspace/.claude
      - evonexus_agent_memory:/workspace/.claude/agent-memory
      - evonexus_codex_auth:/root/.codex
      ## Sem isto o Daily Backup (21:00) escrevia em /workspace/backups da
      ## camada efêmera do container: sobrevivia até o próximo restart do
      ## serviço (deploy, docker service update por qualquer motivo) e
      ## sumia — o volume evonexus_backups já existia e já estava montado
      ## no dashboard, só nunca tinha sido montado aqui, que é quem roda o
      ## backup de fato. Achado em 27/08/2026 via backup_watchdog.py.
      - evonexus_backups:/workspace/backups

    networks:
      - network_public

    environment:
      - DASHBOARD_API_TOKEN=${DASHBOARD_API_TOKEN}
      - DASHBOARD_API_USER=${DASHBOARD_API_USER:-admin}
      - EVONEXUS_API_URL=http://evonexus-dashboard:8080
      ## MinIO/S3 for agents a routine might spawn to prepare a social post.
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET:-post}
      - MINIO_PUBLIC_BASE=${MINIO_PUBLIC_BASE}
      - TZ=America/Sao_Paulo
      - REQUIRE_ANTHROPIC_KEY=1
      - GROQ_API_KEY=${GROQ_API_KEY}
      ## Provider API Keys (needed for fallback chain)
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TELEGRAM_TIMEOUT=900
      - TELEGRAM_MAX_TURNS=30
      - SMTP_DOMAIN=${SMTP_DOMAIN}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_ADDRESS=${SMTP_ADDRESS}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_AUTHENTICATION=${SMTP_AUTHENTICATION}
      - SMTP_ENABLE_STARTTLS_AUTO=${SMTP_ENABLE_STARTTLS_AUTO}
      ## Status Diário (WhatsApp) — daily_status_report.py. EVOLUTION_GO_SEND_TOKEN
      ## é o token da instância "sistema-britto" (quem envia); WHATSAPP_PHONE é o
      ## número conectado na instância "felipe" (quem recebe) — os dois puxados de
      ## GET /instance/all na Evolution Go, não digitados de cabeça.
      - EVOLUTION_GO_URL=${EVOLUTION_GO_URL}
      - EVOLUTION_GO_SEND_TOKEN=${EVOLUTION_GO_SEND_TOKEN}
      - WHATSAPP_PHONE=${WHATSAPP_PHONE}
      ## Telegram — credenciais para o scheduler enviar relatórios e alertas
      ## via notifications.py. Antes estas vars só existiam no serviço
      ## telegram_provider_bot; o scheduler não as tinha e o Hourly Report
      ## falhava silenciosamente.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}

    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: "1024M"

  ## Media worker — esteira de vídeo (corte bruto, corte editorial, cortes
  ## virais). Consome MediaJob via polling; ver .claude/rules/esteira-de-video.md.
  ## Reintroduzido em 25/08/2026: existia rodando na VPS (deployado direto por
  ## docker service/stack deploy fora do Portainer) mas tinha sumido deste
  ## arquivo — um deploy a partir dele sem este bloco teria removido o serviço.
  evonexus_media_worker:
    image: excarplex/evo-nexus-media-worker:latest

    volumes:
      - evonexus_media:/workspace/media
      - evonexus_config:/workspace/config

    networks:
      - network_public

    environment:
      - DASHBOARD_API_TOKEN=${DASHBOARD_API_TOKEN}
      - EVONEXUS_API_URL=http://evonexus-dashboard:8080
      - MEDIA_WORKSPACE=/workspace/media
      - MEDIA_SKILLS_DIR=/workspace/.claude/skills-media
      - MEDIA_WORKER_POLL_SECONDS=${MEDIA_WORKER_POLL_SECONDS:-10}
      - MEDIA_JOB_TIMEOUT_SECONDS=${MEDIA_JOB_TIMEOUT_SECONDS:-21600}
      - MEDIA_MAX_FILE_SIZE_BYTES=${MEDIA_MAX_FILE_SIZE_BYTES:-8589934592}
      - TZ=America/Sao_Paulo

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        reservations:
          cpus: "1.0"
          memory: 1024M
        limits:
          cpus: "4.0"
          memory: 5120M

  ## OmniRoute — gateway de IA (237+ providers, fallback automático,
  ## compressão de tokens). O provider "omnirouter" do EvoNexus aponta
  ## para http://omniroute:20128/v1 (DNS interno via alias).
  ## Dashboard público em omni.workflowapi.com.br com auth nativa (login).
  omniroute:
    image: diegosouzapw/omniroute:latest
    depends_on:
      - redis

    volumes:
      - omniroute_data:/app/data

    networks:
      network_public:
        aliases:
          - omniroute

    ## Auth NATIVA do OmniRoute (login com INITIAL_PASSWORD, sessão JWT em
    ## cookie). NÃO usar basic-auth do Traefik na frente: as chamadas
    ## internas do dashboard (SSE/WS/API) usam Authorization próprio e
    ## entram em loop de 401 com o basic-auth.
    ## Segredos via env da stack no Portainer:
    ##   OMNIROUTE_INITIAL_PASSWORD → senha de login do dashboard
    ##   OMNIROUTE_JWT_SECRET       → openssl rand -base64 48
    ##   OMNIROUTE_API_KEY_SECRET   → openssl rand -hex 32
    ##   OMNIROUTE_STORAGE_KEY      → openssl rand -hex 32
    environment:
      - TZ=America/Sao_Paulo
      - PORT=20128
      - REQUIRE_API_KEY=true
      - INITIAL_PASSWORD=${OMNIROUTE_INITIAL_PASSWORD}
      - JWT_SECRET=${OMNIROUTE_JWT_SECRET}
      - API_KEY_SECRET=${OMNIROUTE_API_KEY_SECRET}
      - STORAGE_ENCRYPTION_KEY=${OMNIROUTE_STORAGE_KEY}
      - AUTH_COOKIE_SECURE=true
      - OMNIROUTE_TRUST_PROXY=true
      - NEXT_PUBLIC_BASE_URL=https://omni.workflowapi.com.br
      - OMNIROUTE_PUBLIC_BASE_URL=https://omni.workflowapi.com.br
      - CORS_ALLOWED_ORIGINS=https://omni.workflowapi.com.br
      - REDIS_URL=redis://redis:6379

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:20128/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "2"
          memory: "2048M"
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - traefik.http.routers.omniroute.rule=Host(`omni.workflowapi.com.br`)
        - traefik.http.routers.omniroute.entrypoints=websecure
        - traefik.http.routers.omniroute.tls.certresolver=letsencryptresolver
        - traefik.http.services.omniroute.loadbalancer.server.port=20128
        - traefik.http.services.omniroute.loadbalancer.passHostHeader=true

  ## OpenReply migrou pra stack própria em 25/08/2026 — ver openreply-vps.stack.yml
  ## e o comentário no topo deste arquivo. Não redeclarar aqui.

volumes:
  evonexus_media:
  evonexus_config:
  evonexus_workspace:
  evonexus_dashboard_data:
  evonexus_memory:
  evonexus_backups:
  evonexus_adw_logs:
  evonexus_claude_workspace:
  evonexus_agent_memory:
  evonexus_claude_auth:
  evonexus_codex_auth:
  evonexus_openclaude_auth:
  omniroute_data:

networks:
  network_public:
    external: true
    name: network_public