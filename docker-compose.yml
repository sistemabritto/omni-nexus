services:
  # Dashboard — Flask + React (single container)
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.swarm.dashboard
    container_name: evonexus-dashboard
    ports:
      - "8081:8080"
      - "32352:32352"
    env_file: .env
    environment:
      - TZ=America/Sao_Paulo
      - EVONEXUS_PORT=8080
      - TERMINAL_SERVER_PORT=32352
    volumes:
      - claude-auth:/root/.claude
      - openclaude-auth:/root/.openclaude
      - ./config:/workspace/config
      - ./workspace:/workspace/workspace
      - ./dashboard/data:/workspace/dashboard/data
      - ./.claude/agents:/workspace/.claude/agents:ro
      - ./.claude/skills:/workspace/.claude/skills:ro
      - ./.claude/commands:/workspace/.claude/commands:ro
      - ./.claude/templates:/workspace/.claude/templates:ro
      - ./memory:/workspace/memory:ro
      - ./ADWs/logs:/workspace/ADWs/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Telegram — bot that listens for messages
  telegram:
    build: .
    container_name: evonexus-telegram
    entrypoint: ["claude"]
    command: ["--channels", "plugin:telegram@claude-plugins-official", "--dangerously-skip-permissions"]
    env_file: .env
    environment:
      - TZ=America/Sao_Paulo
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - daily-logs:/workspace/workspace/daily-logs
      - projects:/workspace/workspace/projects
      - community:/workspace/workspace/community
      - financial:/workspace/workspace/finance
      - personal:/workspace/workspace/personal
      - meetings:/workspace/workspace/meetings
      - strategy:/workspace/workspace/strategy
      - memory:/workspace/memory
      - adw-logs:/workspace/ADWs/logs
      - agent-memory:/workspace/.claude/agent-memory
    restart: unless-stopped
    stdin_open: true
    tty: true

  # OpenSEO — self-hosted SEO data layer (plugin open-seo).
  # Official image and env contract from every-app/open-seo @ compose.yaml.
  # AUTH_MODE=local_noauth is the upstream setting for a private, non
  # internet-facing deployment — the port is bound to 127.0.0.1 only, so it is
  # reachable by the dashboard/agents and by nobody else.
  open-seo:
    image: ${OPEN_SEO_IMAGE:-ghcr.io/every-app/open-seo:latest}
    container_name: evonexus-open-seo
    environment:
      # Required for Docker self-hosting: exposes Compose env vars to the
      # cloudflare:workers bindings the app is built against.
      - CLOUDFLARE_INCLUDE_PROCESS_ENV=true
      - TZ=America/Sao_Paulo
      - PORT=${OPEN_SEO_PORT:-3001}
      - ALLOWED_HOST=${OPEN_SEO_ALLOWED_HOST:-}
      - AUTH_MODE=local_noauth
      - OPENSEO_TELEMETRY_DISABLED=${OPENSEO_TELEMETRY_DISABLED:-1}
      # The only credential that actually costs money — pay-as-you-go at
      # DataForSEO. Without it the UI loads but every query comes back empty.
      - DATAFORSEO_API_KEY=${DATAFORSEO_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-}
      - VITE_SHOW_DEVTOOLS=false
    ports:
      - "127.0.0.1:${OPEN_SEO_PORT:-3001}:${OPEN_SEO_PORT:-3001}"
    volumes:
      - open-seo-data:/app/.wrangler
    restart: unless-stopped

  # Runner on-demand — to execute routines manually
  # Usage: docker compose run --rm runner ADWs/routines/good_morning.py
  runner:
    build: .
    container_name: evonexus-runner
    env_file: .env
    environment:
      - TZ=America/Sao_Paulo
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - daily-logs:/workspace/workspace/daily-logs
      - projects:/workspace/workspace/projects
      - community:/workspace/workspace/community
      - financial:/workspace/workspace/finance
      - personal:/workspace/workspace/personal
      - meetings:/workspace/workspace/meetings
      - strategy:/workspace/workspace/strategy
      - memory:/workspace/memory
      - adw-logs:/workspace/ADWs/logs
      - agent-memory:/workspace/.claude/agent-memory
    profiles:
      - manual

volumes:
  claude-auth:
  openclaude-auth:
  open-seo-data:
  daily-logs:
  projects:
  community:
  financial:
  personal:
  meetings:
  strategy:
  memory:
  adw-logs:
  agent-memory:
