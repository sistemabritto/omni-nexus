# VPS recovery image tags are local to swissnode. Merge after the main stack:
# docker stack deploy -c evonexus-vps.stack.yml -c agent-recovery.override.yml evonexus
#
# O bloco `omniroute` que vivia aqui (imagem vps-tuned-20260909 + tuning de
# stream/timeout/recursos) foi incorporado direto em omniroute-vps.stack.yml
# em 11/09/2026, quando o OmniRoute virou stack própria. Não precisa mais
# deste override para ele — a imagem/tuning real agora é a fonte única
# naquele arquivo. Ver o cabeçalho dele para o histórico.
version: "3.8"
services:
  evonexus_telegram:
    image: evo-nexus-runtime:harness-fix-20260909
    environment:
      TELEGRAM_TRANSCRIPTION_PROVIDER: omniroute
      TELEGRAM_VISION_MODEL: Britto-Core
      TELEGRAM_TIMEOUT: "1800"
      TELEGRAM_PER_ATTEMPT_TIMEOUT_CAP: "900"
  evonexus_scheduler:
    image: evo-nexus-runtime:harness-fix-20260909
    environment:
      TELEGRAM_TIMEOUT: "1800"
      TELEGRAM_PER_ATTEMPT_TIMEOUT_CAP: "900"
      BACKUP_RETAIN_LOCAL: "3"
  evonexus_dashboard:
    image: evo-nexus-dashboard:harness-fix-20260909
    environment:
      BACKUP_RETAIN_LOCAL: "3"
