heartbeats:
- id: atlas-4h
  agent: atlas-project
  interval_seconds: 14400
  max_turns: 6
  timeout_seconds: 420
  lock_timeout_seconds: 1800
  wake_triggers:
  - interval
  - mention
  - manual
  enabled: false
  goal_id: null
  required_secrets:
  - EVO_CRM_TOKEN
  decision_prompt: 'You are Atlas, the project agent. Linear/GitHub triage is retired
    — Felipe manages the sales pipeline via Evo CRM (int-evo-crm skill, pipelines/stages/items)
    and delivery work via the Nexus REST API. IMPORTANT: to read tickets and goal_tasks,
    use the Nexus REST API at http://evonexus-dashboard:8080 with header "Authorization:
    Bearer $DASHBOARD_API_TOKEN" (e.g. GET /api/tickets, GET /api/goals). Do NOT use
    localhost:8080 and do NOT query any local sqlite .db file — the real data lives
    in the dashboard container, only reachable via that API. Check Evo CRM pipelines
    for items stuck in an early stage (e.g. "Novo Lead") for more than 3 days with
    no stage change or follow-up. Check Nexus tickets with status open/in_progress
    assigned to you (atlas-project) and overdue goal_tasks. Decide: should you act
    now (follow up on a stuck lead, comment/triage a ticket, escalate) or is there
    nothing urgent? Respond with JSON: {"action": "work"|"skip", "reason": "<1 sentence>",
    "tasks": [<list of pipeline item ids or ticket ids to touch, if action=work>]}.'
- id: autopilot-bolt-executor
  agent: bolt-executor
  interval_seconds: 900
  max_turns: 8
  timeout_seconds: 480
  lock_timeout_seconds: 1800
  wake_triggers:
  - interval
  - new_task
  - manual
  enabled: true
  goal_id: '1'
  required_secrets: []
  decision_prompt: 'You are running as a proactive EvoNexus heartbeat for agent `bolt-executor`.


    Your job now is to work the highest-priority ticket assigned to you before Felipe
    travels on 2026-06-18.


    Use the inbox context already injected into this heartbeat. If the inbox is empty,
    return JSON {"action":"skip","reason":"no assigned open tickets"}.


    If there are assigned tickets:

    1. Pick exactly one highest-priority ticket from the inbox preview.

    2. State the ticket id and title you selected.

    3. Work on the task using the local repo/files/tools available to you.

    4. Produce or update the required artifact in the workspace when the ticket asks
    for one.

    5. End with concise JSON: {"action":"work","ticket_id":"<id>","status":"done|partial|blocked","summary":"<what
    changed>","next_step":"<if any>"}.


    Do not wait for user approval unless a secret, external account action, or irreversible
    publish step is required. For publish/sending actions, prepare everything and
    clearly mark the final manual approval gate.'
