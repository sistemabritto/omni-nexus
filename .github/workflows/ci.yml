name: CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "dashboard/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"
  push:
    branches: [develop, main]
    paths:
      - "dashboard/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      image_boot_smoke:
        description: Boot the pinned reviewed caf1612 dashboard image with isolated fixture data
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Sync Python dependencies
        run: uv sync --frozen --dev

      # tests/goals, tests/tickets e tests/heartbeats nunca rodavam em PR —
      # eram 47 dos ~50 arquivos de teste no ponto cego. Todos os defeitos da
      # auditoria de 2026-07-27 (CHECK sem 'archived', HTML não escapado no
      # Telegram, formato de timestamp que matava o re-nudge) viviam ali.
      #
      # tests/backend/test_mempalace_routes.py segue de fora: 23 falhas por
      # ModuleNotFoundError, porque mempalace só vem instalado na imagem do
      # dashboard. É dívida de teste, não defeito de produto.
      - name: Run backend tests
        run: >
          uv run python -m pytest
          tests/backend/test_auth_security.py
          tests/backend/test_health_routes.py tests/backend/test_live_disabled_routes.py
          tests/backend/test_live_transport.py tests/backend/test_live_socket_integration.py tests/backend/test_live_app_wiring.py
          tests/backend/test_share_publico.py
          tests/backend/test_telegram_provider_bot.py tests/backend/test_telegram_continuity.py
          tests/backend/test_runtime_preflight.py tests/backend/test_approval_expiration_state.py
          tests/goals tests/tickets tests/heartbeats
          tests/media/test_media_retry_loop.py tests/media/test_routes_media_jobs.py
          -q

  terminal-server:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/terminal-server/package-lock.json

      - name: Install terminal server dependencies
        working-directory: dashboard/terminal-server
        run: npm ci

      - name: Test Live bridge with mocked provider
        run: node --test dashboard/live-prototype/bridge.test.cjs

      - name: Run terminal server tests
        working-directory: dashboard/terminal-server
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: dashboard/frontend
        run: npm ci

      - name: Build frontend
        working-directory: dashboard/frontend
        run: npm run build

  image-boot-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.image_boot_smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE: excarplex/evo-nexus-dashboard@sha256:eafe5f27d9187194bd5f3ec8b857ce947ac8060661b4d99b8146b01d4773b05d
      EXPECTED_REVISION: caf161273777366fab96fc3f35e33ec6d70d3c63
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check isolated runner capacity
        run: |
          df -h /var/lib/docker
          available=$(df --output=avail -B1 /var/lib/docker | tail -1)
          test "$available" -ge 18000000000
      - name: Pull and verify reviewed immutable image
        run: |
          docker pull "$IMAGE"
          actual=$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          test "$actual" = "$EXPECTED_REVISION"
      - name: Boot Flask with ephemeral fixture data and no external network
        run: |
          docker run -d --name live-image-smoke --network none \
            --cpus 2 --memory 3g --pids-limit 256 --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /workspace/dashboard/data:rw,size=256m \
            --mount type=bind,src="$GITHUB_WORKSPACE/qa/live-image-smoke",dst=/smoke,readonly \
            -e EVONEXUS_SECRET_KEY=fixture-image-smoke-only \
            -e BRAIN_REPO_MASTER_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            -e DASHBOARD_API_TOKEN=fixture-agent-token \
            -e GEMINI_LIVE_ENABLED=false -e GEMINI_FREE_TIER_VERIFIED=false \
            -e GEMINI_API_KEY= -e GEMINI_LIVE_MODEL= -e TELEGRAM_CHAT_ID= \
            --entrypoint /workspace/.venv/bin/python "$IMAGE" /smoke/boot.py
      - name: Smoke assets, browser auth and disabled WebSocket
        run: docker exec live-image-smoke /workspace/.venv/bin/python /smoke/check.py
      - name: Remove ephemeral smoke container
        if: always()
        run: docker rm -f live-image-smoke 2>/dev/null || true
