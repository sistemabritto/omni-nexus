heartbeats:
- id: atlas-4h
  agent: atlas-project
  interval_seconds: 14400
  max_turns: 10
  timeout_seconds: 300
  lock_timeout_seconds: 1800
  wake_triggers:
  - interval
  - mention
  - manual
  enabled: false
  goal_id: null
  required_secrets:
  - EVO_CRM_TOKEN
  decision_prompt: 'You are Atlas, the project agent. Linear/GitHub triage is retired
    — Felipe manages the sales pipeline via Evo CRM (int-evo-crm skill, pipelines/stages/items)
    and delivery work via the Nexus REST API. IMPORTANT: to read tickets and goal_tasks,
    use the Nexus REST API at http://evonexus-dashboard:8080 with header "Authorization:
    Bearer $DASHBOARD_API_TOKEN" (e.g. GET /api/tickets, GET /api/goals). Do NOT use
    localhost:8080 and do NOT query any local sqlite .db file — the real data lives
    in the dashboard container, only reachable via that API. Check Evo CRM pipelines
    for items stuck in an early stage (e.g. "Novo Lead") for more than 3 days with
    no stage change or follow-up. Check Nexus tickets with status open/in_progress
    assigned to you (atlas-project) and overdue goal_tasks. Decide: should you act
    now (follow up on a stuck lead, comment/triage a ticket, escalate) or is there
    nothing urgent? Respond with JSON: {"action": "work"|"skip", "reason": "<1 sentence>",
    "tasks": [<list of pipeline item ids or ticket ids to touch, if action=work>]}.'
- id: zara-2h
  agent: zara-cs
  interval_seconds: 7200
  max_turns: 15
  timeout_seconds: 300
  lock_timeout_seconds: 1800
  wake_triggers:
  - interval
  - new_task
  - manual
  enabled: false
  goal_id: null
  required_secrets: []
  decision_prompt: 'You are Zara, the customer success agent. Check the support queue
    via the Nexus REST API: GET http://evonexus-dashboard:8080/api/tickets with header
    "Authorization: Bearer $DASHBOARD_API_TOKEN" (do NOT use localhost:8080 or local
    sqlite files). Look for tickets with status "open" or "pending" assigned to you.
    Pick the highest-priority ticket (by urgency label, then oldest created_at). Decide:
    should you work on it now or is the queue empty/nothing actionable? Respond with
    JSON: {"action": "work"|"skip", "reason": "<1 sentence>", "ticket_id": "<id or
    null>"}.

    '
- id: flux-6h
  agent: flux-finance
  interval_seconds: 21600
  max_turns: 10
  timeout_seconds: 300
  lock_timeout_seconds: 1800
  wake_triggers:
  - interval
  - manual
  enabled: false
  goal_id: null
  required_secrets:
  - ABACATEPAY_API_KEY
  - EVO_CRM_TOKEN
  decision_prompt: 'You are Flux, the finance agent. Check AbacatePay (list_checkouts,
    list_transparent via the custom-int-abacatepay skill) for failed or pending PIX/boleto
    payments in the last 6 hours. Check Evo CRM (int-evo-crm skill) for billing/CRM
    items that need action. If you need Nexus tickets or goals, use the Nexus REST
    API at http://evonexus-dashboard:8080 with header "Authorization: Bearer $DASHBOARD_API_TOKEN"
    (e.g. GET /api/tickets) — do NOT use localhost:8080 or local sqlite files. Decide:
    is there something urgent requiring action or escalation to Felipe via Telegram?
    Respond with JSON: {"action": "work"|"skip", "reason": "<1 sentence>", "alerts":
    [<list of critical items, if any>]}.'
- id: integrations-health
  agent: system
  interval_seconds: 900
  max_turns: 0
  timeout_seconds: 60
  lock_timeout_seconds: 1800
  wake_triggers:
  - interval
  - manual
  enabled: true
  goal_id: null
  required_secrets: []
  decision_prompt: ''
  handler: plugin_integration_health.tick
- id: confirmar-publicacoes
  agent: system
  interval_seconds: 1200
  max_turns: 0
  timeout_seconds: 120
  lock_timeout_seconds: 1800
  wake_triggers:
  - interval
  - manual
  enabled: true
  goal_id: null
  required_secrets: []
  decision_prompt: ''
  handler: publicacoes.tick
- id: nexus-orchestrator
  agent: system
  interval_seconds: 300
  max_turns: 0
  timeout_seconds: 120
  lock_timeout_seconds: 600
  wake_triggers:
  - interval
  - manual
  enabled: true
  goal_id: null
  required_secrets: []
  decision_prompt: ''
  handler: nexus_orchestrator.tick
- id: pixel-growth-6h
  agent: pixel-social-media
  interval_seconds: 21600
  max_turns: 15
  timeout_seconds: 300
  lock_timeout_seconds: 1800
  wake_triggers:
  - interval
  - manual
  - mention
  enabled: true
  goal_id: null
  required_secrets: []
  decision_prompt: 'You are Pixel, the social media agent, waking up in growth-heartbeat
    mode to keep the content pipeline full — not to write content directly. List active
    Goals (GET /api/goals?status=active) that already have at least one ticket assigned
    to you (GET /api/tickets?assignee_agent=pixel-social-media&goal_id=<id>) — those
    are the content/growth Goals you own. For each, count YOUR tickets in status open/in_progress
    linked to it. If that count is below 3 and the Goal is not achieved/cancelled/past
    its due_date, propose up to 3 new, concrete content tickets (specific titles, not
    generic "create a post") via POST /api/tickets with assignee_agent=pixel-social-media
    and goal_id set — check existing titles first so you never propose a near-duplicate.
    Never set publish_intent here or publish anything directly — that stays gated behind
    the existing Telegram approval + Postiz confirmation flow. If every Goal you own
    already has enough queued work, action=skip. Respond with JSON: {"action": "work"|"skip",
    "reason": "<1 sentence>", "goals_topped_up": [<list of goal ids you created tickets
    for, if any>]}.

    '
- id: goal-planner
  agent: goal-planner
  interval_seconds: 86400
  max_turns: 15
  timeout_seconds: 300
  lock_timeout_seconds: 1800
  wake_triggers:
  - goal_created
  - manual
  enabled: true
  goal_id: null
  required_secrets: []
  decision_prompt: 'You are goal-planner. A top-level Goal was just created — its
    id is in the Trigger payload above. Decompose it into 2-6 concrete, assignable
    tickets per your agent instructions (.claude/agents/goal-planner.md), or skip
    if it already has tickets (idempotency) or there is no goal_id in the trigger
    payload.

    '
