name: Build & Publish (Docker Hub Sistema Britto)

# Single publisher for the three OmniNexus service images.
# OmniRoute belongs to a separate stack and is excluded from this workflow.
# Manual target selection never changes the fixed Docker Hub namespace.

on:
  push:
    branches: [main]
    tags: ['v*', 'rc*']
  workflow_dispatch:
    inputs:
      target:
        description: OmniNexus images to publish from this exact revision
        type: choice
        options: [all, core, dashboard, media-worker, media]
        default: all

# Serialize publication across refs; never cancel a running image build.
concurrency:
  group: omninexus-image-publication
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: docker.io
  NAMESPACE: excarplex

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      revision: ${{ steps.targets.outputs.revision }}
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Resolve approved image targets
        id: targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          IMAGE_TARGET: ${{ inputs.target || 'all' }}
        run: python3 scripts/ci/image_targets.py

  build-and-push:
    name: Build & push ${{ matrix.image }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}

      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}
          labels: |
            org.opencontainers.image.licenses=LicenseRef-EvoNexus
            org.opencontainers.image.revision=${{ needs.prepare.outputs.revision }}
          flavor: |
            latest=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # amd64 só já cobre VPS comum; adicione linux/arm64 se sua VPS for ARM
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # CACHEBUST muda a cada run e invalida a camada `npm install -g
          # @anthropic-ai/claude-code / @gitlawb/openclaude@latest / ...` —
          # sem isso, cache-from/cache-to type=gha reaproveitaria a camada
          # antiga entre builds e "@latest" nunca puxaria versão nova.
          build-args: |
            CACHEBUST=${{ github.run_id }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - name: Record immutable publication result
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REVISION: ${{ needs.prepare.outputs.revision }}
        run: |
          printf '%s\n' "Image: $IMAGE@$DIGEST" "Source: $REVISION" >> "$GITHUB_STEP_SUMMARY"
